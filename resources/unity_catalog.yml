resources:
  schemas:
    fleetpulse:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Fleet telematics pipeline (${bundle.target}). Managed by the ${bundle.name} bundle; do not edit by hand.

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.fleetpulse.name}
      name: landing
      volume_type: MANAGED
      comment: Raw ping files as delivered by the trucks (or the simulator).

    checkpoints:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.fleetpulse.name}
      name: checkpoints
      volume_type: MANAGED
      comment: Streaming checkpoints and Auto Loader schema state. Never delete a folder here; to replay a stream, give it a new checkpoint name in code.
