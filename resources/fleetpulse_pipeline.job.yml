resources:
  jobs:
    fleetpulse_pipeline:
      name: ${bundle.name}-pipeline-${bundle.target}
      description: Applies pending schema migrations, then moves pings landing -> bronze -> silver -> the two gold tables.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tags:
        project: ${bundle.name}
        env: ${bundle.target}

      schedule:
        quartz_cron_expression: ${var.pipeline_cron}
        timezone_id: ${var.schedule_timezone}
        pause_status: ${var.pipeline_pause_status}

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.fleetpulse.name}
        - name: landing_path
          default: /Volumes/${var.catalog}/${resources.schemas.fleetpulse.name}/${resources.volumes.landing.name}/pings
        - name: checkpoint_volume
          default: ${resources.volumes.checkpoints.name}
        - name: fleet_size
          default: ${var.fleet_size}
        - name: region_window_minutes
          default: ${var.region_window_minutes}
        - name: geofence_box
          default: ${var.geofence_box}

      tasks:
        - task_key: migrate
          notebook_task:
            notebook_path: ../src/migrate.py
            base_parameters:
              migrations_dir: ${workspace.file_path}/src/migrations

        - task_key: seed_truck_details
          depends_on:
            - task_key: migrate
          notebook_task:
            notebook_path: ../src/seed_truck_details.py

        - task_key: bronze
          depends_on:
            - task_key: migrate
          notebook_task:
            notebook_path: ../src/bronze.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/silver.py

        - task_key: gold_truck_position
          depends_on:
            - task_key: silver
            - task_key: seed_truck_details
          notebook_task:
            notebook_path: ../src/gold_truck_position.py

        - task_key: gold_region_pings
          depends_on:
            - task_key: silver
            - task_key: seed_truck_details
          notebook_task:
            notebook_path: ../src/gold_region_pings.py
