resources:
  jobs:
    fleetpulse_simulator:
      name: ${bundle.name}-simulator-${bundle.target}
      description: Writes synthetic GPS ping files into the landing volume. Stands in for the real device feed.
      max_concurrent_runs: 1
      tags:
        project: ${bundle.name}
        env: ${bundle.target}

      parameters:
        - name: landing_path
          default: /Volumes/${var.catalog}/${resources.schemas.fleetpulse.name}/${resources.volumes.landing.name}/pings
        - name: fleet_size
          default: ${var.fleet_size}
        - name: batches
          default: "20"
        - name: interval_seconds
          default: "3"

      tasks:
        - task_key: generate_pings
          notebook_task:
            notebook_path: ../src/generate_pings.py
