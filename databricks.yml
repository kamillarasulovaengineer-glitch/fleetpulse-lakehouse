bundle:
  name: fleetpulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog shared by all targets. Created once by scripts/create_catalog.sh.
    default: telematics
  schema:
    description: Per-target schema that holds every table, volume and checkpoint.
  pipeline_cron:
    description: Quartz cron for the pipeline job.
    default: "0 0 * * * ?"
  pipeline_pause_status:
    description: PAUSED or UNPAUSED.
    default: PAUSED
  schedule_timezone:
    description: Time zone the pipeline schedule is evaluated in.
    default: America/New_York
  fleet_size:
    description: Number of trucks the simulator and the truck_details seed generate (TRK-001 ...).
    default: "20"
  region_window_minutes:
    description: Tumbling window size, in minutes, for gold_region_pings.
    default: "5"
  geofence_box:
    description: Box behind gold_truck_position.in_geofence, as lat_min,lat_max,lon_min,lon_max.
    default: "41.80,41.95,-87.75,-87.55" # downtown Chicago
  warehouse_id:
    description: SQL warehouse behind the dashboard.
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: dev

  test:
    variables:
      schema: test
      pipeline_cron: "0 0 * * * ?" # hourly
      pipeline_pause_status: UNPAUSED

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: prod
      pipeline_cron: "0 0/15 * * * ?" # every 15 minutes
      pipeline_pause_status: UNPAUSED
