bundle:
  name: fleetpulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog shared by all targets. Created once, outside the bundle (see README).
    default: telematics
  schema:
    description: Per-target schema that holds every table, volume and checkpoint.
  pipeline_cron:
    description: Quartz cron for the pipeline job.
    default: "0 0 * * * ?"
  pipeline_pause_status:
    description: PAUSED or UNPAUSED.
    default: PAUSED
  warehouse_id:
    description: SQL warehouse behind the dashboard.
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: dev

  test:
    variables:
      schema: test
      pipeline_cron: "0 0 * * * ?" # hourly
      pipeline_pause_status: UNPAUSED

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: prod
      pipeline_cron: "0 0/15 * * * ?" # every 15 minutes
      pipeline_pause_status: UNPAUSED
