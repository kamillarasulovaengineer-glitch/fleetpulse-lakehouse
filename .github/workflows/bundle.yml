name: bundle

# dev -> dev, test -> test, main -> prod. A PR lints and validates; the merge deploys and runs.
on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  validate:
    # PRs from forks get no secrets
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ (github.base_ref == 'main' && 'prod') || (github.base_ref == 'test' && 'test') || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: pipx run ruff==0.16.10 check . && pipx run ruff==0.16.10 format --check .
      - uses: databricks/setup-cli@v1.19.0
      - name: Validate
        run: databricks bundle validate -t "$TARGET"

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' && 'prod') || (github.ref_name == 'test' && 'test') || 'dev' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TARGET: ${{ (github.ref_name == 'main' && 'prod') || (github.ref_name == 'test' && 'test') || 'dev' }}
      PAUSE: ${{ vars.PIPELINE_PAUSE_STATUS }} # per GitHub environment (PAUSED on test/prod: Free Edition quota)
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.19.0
      - name: Validate
        run: databricks bundle validate -t "$TARGET"
      - name: Deploy
        run: databricks bundle deploy -t "$TARGET" ${PAUSE:+--var=pipeline_pause_status=$PAUSE}
      - name: Run pipeline
        run: databricks bundle run fleetpulse_pipeline -t "$TARGET" ${PAUSE:+--var=pipeline_pause_status=$PAUSE}
